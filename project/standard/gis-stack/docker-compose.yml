version: "3.8"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gis
      - POSTGRES_PASSWORD=gis
      - POSTGRES_DB=gisdb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  geoserver:
    image: kartoza/geoserver:2.23.6
    container_name: geoserver
    restart: unless-stopped
    environment:
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_ADMIN_USER=admin
      - ENABLE_JSONP=true
    ports:
      - "8080:8080"
    volumes:
      - ./geoserver-data:/opt/geoserver/data_dir
    depends_on:
      - postgis

  mapstore:
    image: geosolutionsit/mapstore2:latest
    container_name: mapstore
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # (opcional) para que el login apunte a la propia app
      - PROXY_BASE_URL=http://localhost:8081/mapstore
